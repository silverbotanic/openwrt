name: Build Wavlink WN531AX2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ramips_wavlink_wl-wn531ax2

      - name: Install build dependencies
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler diffutils ecj fastjar file flex \
            g++ gawk gcc gengetopt gettext git gperf haveged help2man intltool lib32gcc-s1 \
            lib32stdc++6 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev \
            libtool lrzsz mkisofs msmtp nano ninja-build patchutils perl python3 python3-distutils \
            python3-pip python3-setuptools python3-yaml qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo unzip uuid-dev wget xsltproc xz-utils zip zlib1g-dev

      - name: Configure target
        run: |
          cat >> .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_wavlink_wl-wn531ax2=y
          EOF
          make defconfig

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build firmware
        run: make -j$(nproc) V=sc

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavlink-wn531ax2-openwrt
          path: |
            bin/targets/ramips/mt7621/*wavlink*wn531ax2*
          if-no-files-found: error
